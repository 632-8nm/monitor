name: Build & Deploy

# On push to main: cross-compile in the cloud and deploy to the board over SSH (via Cloudflare Tunnel)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cross-compile for arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o monitor_server .
          file monitor_server
          chmod +x monitor_server

      - name: Upload build artifacts (binary + frontend)
        uses: actions/upload-artifact@v4
        with:
          name: monitor_deploy
          path: |
            monitor_server
            index.html
            static/
          retention-days: 1

  deploy:
    name: Deploy to board
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: monitor_deploy
          path: .

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Write board SSH key
        run: |
          echo "$BOARD_SSH_KEY" > /tmp/board_key
          chmod 600 /tmp/board_key
        env:
          BOARD_SSH_KEY: ${{ secrets.BOARD_SSH_KEY }}

      - name: Copy binary and restart via Cloudflare Tunnel SSH
        run: |
          set -e
          CF_ID="${CLOUDFLARED_TOKEN%%:*}"
          CF_SECRET="${CLOUDFLARED_TOKEN#*:}"

          # Start the cloudflared access tcp forwarding
          cloudflared access tcp \
            --hostname ssh.632-8nm.cloud \
            --url localhost:2222 \
            --service-token-id "$CF_ID" \
            --service-token-secret "$CF_SECRET" \
            --log-level warn > /tmp/cf-tcp.log 2>&1 &
          CF_PID=$!
          trap "kill $CF_PID 2>/dev/null || true" EXIT

          # Wait for the forwarding to be ready (SSH retry loop, no ss dependency)
          echo "==> Waiting for the tunnel to be ready"
          SSH_OK=0
          for i in $(seq 1 15); do
            if ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=10 -p 2222 orangepi@127.0.0.1 'true' 2>/dev/null; then
              SSH_OK=1
              break
            fi
            sleep 1
          done
          if [ "$SSH_OK" != "1" ]; then
            echo "Error: cannot reach the board through the tunnel, cloudflared log:"
            cat /tmp/cf-tcp.log
            exit 1
          fi

          DEPLOY_DIR=/opt/orangepi-monitor

          echo "==> Stopping the monitor service first (release the binary)"
          ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -p 2222 orangepi@127.0.0.1 "
            set -e
            sudo systemctl stop monitor || true
            sudo fuser -k 8080/tcp || true
            echo 'monitor stopped'
          "

          echo "==> Transferring deployment files (binary + frontend) to the board"
          # Make sure the deploy directory exists
          ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -p 2222 orangepi@127.0.0.1 "
            mkdir -p $DEPLOY_DIR/static
          "
          scp -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -P 2222 monitor_server index.html orangepi@127.0.0.1:$DEPLOY_DIR/
          scp -r -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -P 2222 static/ orangepi@127.0.0.1:$DEPLOY_DIR/

          echo "==> Starting the monitor service over SSH"
          ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -p 2222 orangepi@127.0.0.1 "
            set -e
            echo '==> Replacing the binary'
            chmod +x $DEPLOY_DIR/monitor_server
            sudo systemctl start monitor
            sleep 2
            echo '==> Service status: '\$(systemctl is-active monitor)
            sudo systemctl is-active monitor
          "
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
