name: Build & Deploy

# On push to main: cross-compile in the cloud and deploy to the board over SSH (via Cloudflare Tunnel)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cross-compile for arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-w" -o monitor_server ./cmd/monitor
          file monitor_server
          chmod +x monitor_server

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor_deploy
          path: monitor_server
          retention-days: 1

  deploy:
    name: Deploy to board
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: monitor_deploy
          path: .

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Write board SSH key
        run: |
          echo "$BOARD_SSH_KEY" > /tmp/board_key
          chmod 600 /tmp/board_key
        env:
          BOARD_SSH_KEY: ${{ secrets.BOARD_SSH_KEY }}

      - name: Copy binary and restart via Cloudflare Tunnel SSH
        run: |
          set -e
          CF_ID="${CLOUDFLARED_TOKEN%%:*}"
          CF_SECRET="${CLOUDFLARED_TOKEN#*:}"

          # Start the cloudflared access tcp forwarding
          cloudflared access tcp \
            --hostname ssh.632-8nm.cloud \
            --url localhost:2222 \
            --service-token-id "$CF_ID" \
            --service-token-secret "$CF_SECRET" \
            --log-level warn > /tmp/cf-tcp.log 2>&1 &
          CF_PID=$!
          trap "kill $CF_PID 2>/dev/null || true" EXIT

          # Wait for the forwarding to be ready (SSH retry loop, no ss dependency)
          echo "==> Waiting for the tunnel to be ready"
          SSH_OK=0
          for i in $(seq 1 15); do
            if ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=10 -p 2222 orangepi@127.0.0.1 'true' 2>/dev/null; then
              SSH_OK=1
              break
            fi
            sleep 1
          done
          if [ "$SSH_OK" != "1" ]; then
            echo "Error: cannot reach the board through the tunnel, cloudflared log:"
            cat /tmp/cf-tcp.log
            exit 1
          fi

          DEPLOY_DIR=/opt/orangepi-monitor

          echo "==> Stopping the monitor service first (release the binary)"
          ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -p 2222 orangepi@127.0.0.1 "
            set -e
            sudo systemctl stop monitor || true
            sudo fuser -k 8080/tcp || true
            echo 'monitor stopped'
          "

          # Stream the (embedded-frontend) binary compressed over a single
          # SSH connection: gzip shrinks it to roughly a third of its size.
          # The transfer retries on tunnel hiccups; extraction goes to a
          # temp dir and is moved into place, so an interrupted transfer
          # never truncates the previous binary; if all retries fail, the
          # previous service is restarted instead of leaving the board down.
          echo "==> Transferring the binary to the board"
          SSH_OPTS="-i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p 2222"
          transfer_ok=0
          for attempt in 1 2 3; do
            if tar -czf - monitor_server | ssh $SSH_OPTS orangepi@127.0.0.1 "
              set -e
              tmp=\$(mktemp -d)
              tar -xzf - -C \$tmp
              chmod +x \$tmp/monitor_server
              mv \$tmp/monitor_server $DEPLOY_DIR/monitor_server
              rmdir \$tmp
            "; then
              transfer_ok=1
              break
            fi
            echo "==> Transfer attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          if [ "$transfer_ok" != "1" ]; then
            echo "==> Transfer failed after retries — restarting the previous binary"
            ssh $SSH_OPTS orangepi@127.0.0.1 "sudo systemctl start monitor || true" || true
            exit 1
          fi

          # Deliver runtime secrets from GitHub Secrets into the board's env
          # file (merged, so manually added settings survive). This must run
          # inside this step — the cloudflared tunnel lives and dies with it.
          echo "==> Syncing runtime config (ServerChan key) from Secrets"
          if [ -n "$SERVERCHAN_KEY" ]; then
            ENV_FILE=/etc/default/monitor
            printf 'MONITOR_SERVERCHAN_KEY=%s\n' "$SERVERCHAN_KEY" | ssh -i /tmp/board_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=15 -p 2222 orangepi@127.0.0.1 "
              set -e
              (grep -v '^MONITOR_SERVERCHAN_KEY=' $ENV_FILE 2>/dev/null || true; cat) | sudo tee $ENV_FILE >/dev/null
              echo 'runtime config synced'
            "
          else
            echo 'SERVERCHAN_KEY secret not set, skipping'
          fi

          echo "==> Starting the monitor service over SSH"
          start_ok=0
          for attempt in 1 2 3; do
            if ssh $SSH_OPTS orangepi@127.0.0.1 "
              set -e
              sudo systemctl start monitor
              sleep 2
              echo '==> Service status: '\$(systemctl is-active monitor)
              sudo systemctl is-active monitor
            "; then
              start_ok=1
              break
            fi
            echo "==> Start attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          if [ "$start_ok" != "1" ]; then
            echo "❌ Could not start the service — check the board: systemctl status monitor / journalctl -u monitor -n 50"
            exit 1
          fi
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
