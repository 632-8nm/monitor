name: Release

# Push a version tag (v*) to build an arm64 release package and publish it
# as a GitHub Release. The tarball bundles the binary, frontend files and
# the install/uninstall scripts — end users need no Go toolchain:
#   tar -xzf orangepi-monitor-<tag>-linux-arm64.tar.gz && ./install.sh
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cross-compile for arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-w -X orangepi-monitor/internal/monitor.Version=${GITHUB_REF_NAME}" -o monitor_server ./cmd/monitor
          file monitor_server

      - name: Assemble release package
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="orangepi-monitor-${TAG}"
          mkdir -p "dist/${PKG}"
          cp monitor_server install.sh uninstall.sh "dist/${PKG}/"
          chmod +x "dist/${PKG}/monitor_server" "dist/${PKG}/install.sh" "dist/${PKG}/uninstall.sh"
          tar -czf "dist/${PKG}-linux-arm64.tar.gz" -C dist "$PKG"
          sha256sum "dist/${PKG}-linux-arm64.tar.gz" > "dist/${PKG}-linux-arm64.tar.gz.sha256"
          ls -l dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="orangepi-monitor-${TAG}"
          # Idempotent: re-running for an existing tag (e.g. after a force
          # push) updates the assets instead of failing on create
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "orangepi-monitor ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" \
            "dist/${PKG}-linux-arm64.tar.gz" \
            "dist/${PKG}-linux-arm64.tar.gz.sha256" \
            --clobber
