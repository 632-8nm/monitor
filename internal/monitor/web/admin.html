<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>管理员后台</title>
	<link rel="stylesheet" href="static/css/style.css?v=11">
	<style>
		html, body { height: 100%; }
		body.admin-page { justify-content: flex-start; padding: 1.5rem; }
		.admin-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			max-width: 1100px;
			margin-bottom: 1rem;
			flex: none;
		}
		.admin-bar h1 {
			font-size: 1.1rem;
			color: var(--accent-color);
			letter-spacing: 1px;
		}
		.admin-actions { display: flex; gap: 0.5rem; align-items: center; }
		.admin-btn {
			display: inline-block;
			background: transparent;
			color: var(--text-dim);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 6px;
			padding: 6px 14px;
			font-size: 0.8rem;
			cursor: pointer;
			text-decoration: none;
		}
		.admin-btn:hover {
			color: var(--text-main);
			border-color: var(--text-dim);
		}
		#admin-term {
			width: 100%;
			max-width: 1100px;
			height: calc(100vh - 120px);
			min-height: 400px;
			flex: none;
		}
	</style>
</head>

<body class="admin-page">
	<div class="admin-bar">
		<h1>管理员后台</h1>
		<div class="admin-actions">
			<a class="admin-btn" href="/">← 返回监控页</a>
			<button type="button" class="admin-btn" id="admin-logout">登出</button>
		</div>
	</div>
	<div id="admin-term"></div>

	<script src="static/js/terminal.js?v=3"></script>
	<script>
		// /admin：登录会话有效则直接开终端，否则先弹管理员登录表单
		window.TerminalPanel.attach(document.getElementById('admin-term'));
		window.TerminalPanel.show();
		document.getElementById('admin-logout').addEventListener('click', () => window.TerminalPanel.logoutNow());
	</script>
</body>

</html>
